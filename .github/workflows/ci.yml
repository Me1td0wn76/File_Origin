name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # アーキテクチャ不変条件の検査。
  # fo-platform 以外に OS 固有コードが漏れていないかを見る（ADR-0003）。
  # 設計を口約束にしないため、ビルドと同格の必須ジョブにしている。
  arch-guard:
    name: アーキテクチャ検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: arch-guard
        run: ./scripts/arch-guard.sh

  lint:
    name: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      # 両 OS で必ず回す。プラットフォーム層は実機でしか検証できないため、
      # 片方だけ通っても意味がない。
      - run: cargo build --workspace
      - run: cargo test --workspace

      # 実際に動くことの最小確認。doctor は DB を開かずに動くので、
      # 環境構築なしで実行できる。
      - run: cargo run -p fo-cli -- doctor
