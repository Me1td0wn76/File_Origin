[workspace]
resolver = "2"
members = [
    "crates/fo-core",
    "crates/fo-platform",
    "crates/fo-store",
    "crates/fo-ipc",
    "crates/fo-app",
    "crates/fo-cli",
    "crates/fo-daemon",
    "crates/fo-nativehost",
    "gui/src-tauri",
]

[workspace.package]
version = "0.0.1"
edition = "2021"
license = "MIT"
repository = "https://github.com/Me1td0wn76/File_Origin"
rust-version = "1.82"

# 依存はここに集約する。各クレートは workspace = true で引く。
# バージョンが散らばると更新が破綻するため。
[workspace.dependencies]
fo-core     = { path = "crates/fo-core" }
fo-platform = { path = "crates/fo-platform" }
fo-store    = { path = "crates/fo-store" }
fo-app      = { path = "crates/fo-app" }
fo-ipc      = { path = "crates/fo-ipc" }

anyhow     = "1"
thiserror  = "1"
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
clap       = { version = "4", features = ["derive"] }
sha2       = "0.10"
rusqlite   = { version = "0.32", features = ["bundled"] }
chrono     = "0.4"
# ファイル監視。OS 差（ReadDirectoryChangesW / inotify）を内包するが、
# fo-platform の FsWatcher trait の裏に隠す（ADR-0003）。
notify     = "7"
# ローカル IPC。Windows は名前付きパイプ、Unix はドメインソケットに写る。
interprocess = "2"
# GUI。OS 標準の WebView を使う（Windows: WebView2 / Linux: WebKitGTK）。
tauri = "2"
tauri-build = "2"

# --- OS 固有クレート ---------------------------------------------------
# これらを依存に書いてよいのは fo-platform だけ。
# scripts/arch-guard.sh が他クレートでの使用を検査する。
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    # CreateFileW は引数に SECURITY_ATTRIBUTES を取るため、この feature が無いと
    # 関数定義そのものが cfg で消える（null を渡すだけでも必要）。
    "Win32_Security",
    # Zone.Identifier はシステム ANSI コードページで書かれることがある。
    # MultiByteToWideChar で復号するのに要る。
    "Win32_Globalization",
    # --foreground のとき、起動元の端末に標準出力を繋ぎ直すのに要る。
    "Win32_System_Console",
] }
xattr = "1"

[profile.release]
strip = true
lto = "thin"
